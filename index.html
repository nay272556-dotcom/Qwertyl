const AE=["👣","🔟","📘","🎯","🌟","🎁","🥉","🥈","👑","🔥"];
function streak(){let n=0,d=new Date();while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function achs(){const d=achD();A.innerHTML=bk()+`<div class="card"><h2>🏆 ${t("ach")} (${d.filter(x=>x).length}/${d.length})</h2>${d.map((x,i)=>`<div class="ach ${x?"":"l"}"><span>${AE[i]}</span><b>${t("an")[i]}</b></div>`).join("")}</div>`}
function stats(){const wc=CATS.map(c=>c.w.filter(w=>S.words[w.en]).length);A.innerHTML=bk()+hud()+`<div class="card"><h2>📊 ${t("stats")}</h2><p>${t("ans")}: <b>${S.ans}</b><br>${t("acc")}: <b>${S.ans?Math.round(S.cor*100/S.ans):0}%</b><br>${t("words")}: <b>${Object.keys(S.words).length}/${ALL.length}</b><br>${t("streak")}: <b>${streak()}</b></p>${CATS.map((c,i)=>`${c.e} ${c[S.lang]} ${wc[i]}/8<div class="sb"><i style="width:${wc[i]*12.5}%"></i></div>`).join("")}</div>`}
function sett(){A.innerHTML=bk()+`<div class="card"><h2>⚙️ ${t("set")}</h2><div class="tg">${t("lang")}<span class="row"><button class="opt" onclick="sl('id')">🇮🇩 ID</button><button class="opt" onclick="sl('en')">🇬🇧 EN</button></span></div>
${[["music","music"],["sfx","sound"],["voice","voice"]].map(([k,l])=>`<div class="tg">${t(l)}<button class="opt" onclick="tg('${k}')">${S[k]?"ON":"OFF"}</button></div>`).join("")}
<div class="tg">${t("volume")}<input type="range" min="0" max="1" step=".1" value="${S.vol}" oninput="S.vol=+this.value;sv()"></div>
<button class="btn r" onclick="if(confirm(t('resetq'))){localStorage.removeItem(K);location.reload()}">${t("reset")}</button></div>`}
const sl=l=>{S.lang=l;document.documentElement.lang=l;sv();sett()},tg=k=>{S[k]=!S[k];sv();if(k=="music")mus();sett()};
function guide(){A.innerHTML=bk()+`<div class="card"><h2>❓ ${t("guide")}</h2>${t("gd").map(x=>`<p>• ${x}</p>`).join("")}<h3>${t("mode")}</h3>${t("mn").map((n,i)=>`<p><b>${n}</b>: ${t("i")[i].replace(/\.? ?(Artinya|Meaning):?$/,"")}</p>`).join("")}</div>`}
function info(){A.innerHTML=bk()+`<div class="card center">${WIKO(90)}<h2>WORD QUEST v${CFG.version}</h2><p>${t("about")}</p><p><b>${t("sel")}:</b> ${CFG.seller}<br><b>${t("con")}:</b> ${CFG.contact}</p><p><b>${t("lic")}:</b><br>${CFG.license[S.lang]}</p></div>`}
/* ===== GAME ENGINE ===== */
let G;
const opts=(w,P,n)=>sh(sh(P.filter(x=>x.en!=w.en)).slice(0,n-1).concat(w));
function build(L,cat,m,dl){const P=L>40||dl?ALL:CATS[cat].w,sp=P.filter(w=>w.en.length<=4+(L/5|0)),Q=(m==1||m==2)&&sp.length>=5&&!dl?sp:P,ws=sh(Q).slice(0,5),n=L>10?4:3;
return ws.map((w,k)=>{const mm=dl?Math.floor(Math.random()*6):m,q={m:mm,w,err:0,ans:[]};
if(mm<5)q.p=P;
if(mm==0||mm==4)q.o=opts(w,P,n);
if(mm==1){let s;do s=sh([...w.en]);while(s.join("")==w.en&&w.en.length>1);q.pool=s.map(c=>({t:c,u:0}));q.n=w.en.length}
if(mm==2)q.n=w.en.length;
if(mm==3){const nb=Math.min(1+(L/17|0),w.en.length-2),idx=sh([...w.en].map((c,i)=>i)).slice(0,nb).sort((a,b)=>a-b);q.b=idx;q.fill=[];q.bo=idx.map(i=>{const c=w.en[i];return sh(sh([..."abcdefghijklmnopqrstuvwxyz"].filter(x=>x!=c)).slice(0,3).concat(c))})}
if(mm==5){const s=dl?SE[Math.random()*SE.length|0]:SE[Math.min(SE.length-1,Math.floor((L-1)/50*(SE.length-4))+k)];q.s=s;const ws2=s.en.split(" ");let x;do x=sh(ws2);while(x.join(" ")==s.en&&ws2.length>1);q.pool=x.map(c=>({t:c,u:0}));q.n=ws2.length}
return q})}
function lvl(L){if(L>50)L=50;G={ty:"level",L,qs:build(L,(L-1)%12,mode(L)),i:0,c:0};rq()}
function prac(ci){const L=Math.max(1,Math.min(50,S.max+1)),m=PM<0?(Math.random()*6|0):PM;G={ty:"prac",L,qs:build(L,ci,m),i:0,c:0};rq()}
function daily(){G={ty:"daily",L:15,qs:build(15,0,0,1),i:0,c:0};rq()}
function quit(){if(confirm(t("quit")))menu()}
function rq(){const q=G.qs[G.i],m=q.m;
let h=`<div class="top"><button class="ib" onclick="quit()" aria-label="X">✕</button><div class="bar"><i style="width:${G.i*100/G.qs.length}%"></i></div><span>${G.i+1}/${G.qs.length}</span></div><p class="ins">${t("mn")[m]}<br><small>${t("i")[m]}</small></p><div class="card">`;
if(m==0)h+=`<div class="big">${q.w.e}</div>`+ch(q,x=>x.en,"");
if(m==4)h+=`<div class="center"><button class="btn y" onclick="spk()">🔊 ${t("pa")}</button><div id="na"></div></div>`+ch(q,x=>x.e,"e");
if(m==1||m==5)h+=(m==5?`<p class="center"><b>${q.s.id}</b></p>`:`<div class="big">${q.w.e}</div>`)+`<div class="slots ${q.sh?"shake":""}">${q.ans.map((p,k)=>`<button class="tile" onclick="ra(${k})">${q.pool[p].t}</button>`).join("")||"&nbsp;"}</div><div class="pool">${q.pool.map((p,i)=>`<button class="tile ${p.u?"u":""}" onclick="ta(${i})">${p.t}</button>`).join("")}</div>`;
if(m==2){h+=`<div class="big">${q.w.e}</div><div class="slots ${q.sh?"shake":""}">${[...Array(q.n)].map((_,i)=>`<div class="slot ${q.ans[i]?"f":""}">${q.ans[i]||""}</div>`).join("")}</div><div class="kb">${["qwertyuiop","asdfghjkl","zxcvbnm"].map((r,ri)=>`<div>${[...r].map(c=>`<button class="tile" onclick="kk('${c}')">${c}</button>`).join("")}${ri==2?`<button class="tile" style="background:var(--c)" onclick="kk('<')" aria-label="${t("bk")}">⌫</button>`:""}</div>`).join("")}</div>`}
if(m==3){const f=q.fill.length;h+=`<div class="big">${q.w.e}</div><div class="slots ${q.sh?"shake":""}">${[...q.w.en].map((c,i)=>{const bi=q.b.indexOf(i);return`<div class="slot ${bi>=0&&bi<f?"f":""} ${bi==f?"cur":""}">${bi<0?c:bi<f?c:"_"}</div>`}).join("")}</div>`;
if(f<q.b.length)h+=`<div class="pool">${q.bo[f].map(c=>`<button class="tile" onclick="bl('${c}')">${c}</button>`).join("")}</div>`}
h+="</div>";
if(q.done){const w=q.w,ok=q.ok,tx=m==5?`${q.s.en}</b><br>${t("tr")}: ${q.s.id}`:`${w.e} ${w.en}</b><br>${t("tr")}: ${w.id}`;
h+=`<div class="fb ${ok?"g":"b"}">${ok?"🎉 "+t("good")[G.i%4]:"💪 "+t("oops")}<br><b>${tx}<br><button class="opt" onclick="say('${m==5?q.s.en.replace(/'/g,""):w.en}')">🔊</button><button class="btn g" onclick="nx()">${t("next")} →</button></div>`}
A.innerHTML=h;
if(m==4&&!q.said){q.said=1;if(!say(q.w.en))$("#na").innerHTML=`<p><b style="font-size:28px">${q.w.en}</b><br><small>${t("noa")}</small></p>`}}
function ch(q,f,c){return`<div class="row" style="margin-top:12px">${q.o.map((x,i)=>`<button class="opt ${c} ${q.done?(x.en==q.w.en?"ok":i==q.sel?"no":""):""}" ${q.done?"disabled":""} onclick="pk(${i})">${f(x)}</button>`).join("")}</div>`}
const cq=()=>G.qs[G.i];
function spk(){const q=cq();if(!say(q.w.en))$("#na").innerHTML=`<p><b style="font-size:28px">${q.w.en}</b><br><small>${t("noa")}</small></p>`}
function pk(i){const q=cq();if(q.done)return;q.sel=i;fin(q.o[i].en==q.w.en)}
function ta(i){const q=cq();if(q.done||q.pool[i].u)return;q.pool[i].u=1;q.ans.push(i);if(q.ans.length==q.n)chk();else rq()}
function ra(k){const q=cq();if(q.done)return;q.pool[q.ans[k]].u=0;q.ans.splice(k,1);rq()}
function kk(c){const q=cq();if(q.done)return;if(c=="<")q.ans.pop();else if(q.ans.length<q.n)q.ans.push(c);if(q.ans.length==q.n)chk();else rq()}
function bl(c){const q=cq();if(c==q.w.en[q.b[q.fill.length]]){q.fill.push(c);bp(660,.1,"sine",.2);if(q.fill.length==q.b.length)fin(!q.err);else rq()}else{q.err=1;sfx(false);q.sh=1;rq();q.sh=0}}
function chk(){const q=cq(),v=q.m==5?q.ans.map(i=>q.pool[i].t).join(" "):q.m==1?q.ans.map(i=>q.pool[i].t).join(""):q.ans.join(""),tg=q.m==5?q.s.en:q.w.en;
if(v==tg)fin(!q.err);else{q.err=1;sfx(false);q.sh=1;rq();q.sh=0;setTimeout(()=>{if(cq()===q&&!q.done){q.ans=[];if(q.pool)q.pool.forEach(p=>p.u=0);rq()}},650)}}
function fin(ok){const q=cq();q.done=1;q.ok=ok;G.c+=ok?1:0;S.ans++;if(ok){S.cor++;S.words[q.w.en]=1;conf()}sfx(ok);if(ok)setTimeout(()=>say(q.m==5?q.s.en:q.w.en),500);sv();rq()}
function nx(){G.i++;if(G.i>=G.qs.length)end();else rq()}
function end(){const c=G.c,st=c>=5?3:c>=4?2:c>=3?1:0,pass=st>0,td=today();let xp=c*10+st*5,co=c*2+st*3;
if(G.ty=="level"&&pass){S.max=Math.max(S.max,G.L);S.stars[G.L]=Math.max(S.stars[G.L]||0,st)}
if(G.ty=="daily"){S.daily=td;S.dn++;xp+=30;co+=20}
const before=achD();S.xp+=xp;S.coins+=co;if(!S.days.includes(td))S.days=S.days.concat(td).slice(-60);
if(S.sess.d!=td)S.sess={d:td,n:0};S.sess.n++;
const after=achD(),na=after.map((x,i)=>x&&!S.ach[i]?i:-1).filter(i=>i>=0);na.forEach(i=>{S.ach[i]=1;S.coins+=10});sv();
if(pass)conf();sfx(pass);
const nxt=G.ty=="level"&&pass&&G.L<50?`<button class="btn g" onclick="lvl(${G.L+1})">${t("next")} →</button>`:"";
A.innerHTML=`<div class="card center">${WIKO(90)}<h2>${pass?t("win"):t("fail")}</h2><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><p>✔ ${c}/5 &nbsp; +${xp} ${t("xp")} &nbsp; +${co} 🪙</p>${na.map(i=>`<p class="chip" style="background:var(--s);color:var(--n)">${AE[i]} ${t("newa")} ${t("an")[i]}</p>`).join("")}${S.sess.n>=5?`<p>${t("brk")}</p>`:""}</div>${nxt}<button class="btn y" onclick="${G.ty=="level"?`lvl(${G.L})`:G.ty=="prac"?"cats()":"menu()"}">↻ ${t("retry")}</button><button class="btn" onclick="${G.ty=="level"?"map()":"menu()"}">${t("back")}</button>`}
document.documentElement.lang=S.lang;splash();
</script></body></html>
